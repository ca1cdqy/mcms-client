name: CI

on:
  push:
    branches: [main, 26.2]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.loader }})
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build ${{ matrix.loader }}
        run: |
          chmod +x gradlew
          ./gradlew :${{ matrix.loader }}:build --no-daemon -Penabled_platforms=fabric,neoforge

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: mcms-${{ matrix.loader }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error