pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.minecraftforge.net/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

include("common")
include("fabric")

def mcmsPlatforms = providers.gradleProperty("enabled_platforms").getOrElse("fabric")
if (mcmsPlatforms.contains("neoforge")) {
    include("neoforge")
}

rootProject.name = "mcms"